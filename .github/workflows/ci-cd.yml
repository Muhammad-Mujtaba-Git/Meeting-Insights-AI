services:

  db:
    image: pgvector/pgvector:pg16
    container_name: mi_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meeting_insights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d meeting_insights"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: muhammadmujtabaai/meeting-insight-ai-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - vector_db_data:/app/vector_db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: muhammadmujtabaai/meeting-insight-ai-frontend:latest
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  vector_db_data:
  postgres_data: